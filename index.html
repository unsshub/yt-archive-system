<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YT Archive System - Save and search YouTube videos offline">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="/yt-archive-system/manifest.json">
    <title>YT Archive System</title>
    <link rel="stylesheet" href="/yt-archive-system/assets/main.YlFjrA2U.css">
    <script>
      (function() {
        var rtl = ['ar','he','fa','ur'];
        var lang = (navigator.language||'').split('-')[0];
        if (rtl.includes(lang)) { document.documentElement.dir='rtl'; document.documentElement.lang=lang; }
      })();
    </script>
</head>
<body>
    <div id="offline-banner" class="offline-banner" style="display:none" role="alert">
        ⚠️ You are offline. Changes sync when connection restores.
    </div>
    <div id="app">
        <header class="app-header">
            <h1>📺 YT Archive System</h1>
            <div class="header-controls">
                <span id="sync-status" class="sync-idle" aria-live="polite">✅ Synced</span>
                <span id="connection-status" class="status-disconnected" aria-live="polite">⚠️ Not Connected</span>
                <button id="settings-trigger" class="btn btn-icon" aria-label="Open Settings">⚙️</button>
            </div>
        </header>
        <main class="app-main">
            <section class="add-video-section">
                <h2 class="section-title">Save Video</h2>
                <div class="input-group">
                    <input type="url" id="video-url-input" placeholder="Paste YouTube URL here..." autocomplete="off" />
                    <button id="add-video-btn" class="btn btn-primary">➕ Add</button>
                </div>
                <div id="add-status" class="status-message" aria-live="polite"></div>
            </section>
            <section class="search-section">
                <h2 class="section-title">Search Archive</h2>
                <input type="search" id="search-input" placeholder="Search in English or Arabic..." autocomplete="off" />
            </section>
            <section class="video-grid-section">
                <h2 class="section-title">Video Archive <span id="video-count" class="count-badge">0</span></h2>
                <div id="video-grid" class="video-grid" role="list"></div>
                <div id="empty-state" class="empty-state"><p>📭 No videos saved yet.</p></div>
            </section>
            <section class="sync-section">
                <button id="sync-btn" class="btn btn-secondary">🔄 Sync to GitHub</button>
            </section>
        </main>
        <div id="settings-modal" class="modal" role="dialog" aria-labelledby="settings-title" aria-hidden="true">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="settings-title">⚙️ GitHub Settings</h2>
                    <button id="settings-close" class="btn btn-icon" aria-label="Close Settings">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="pat-input">Personal Access Token (PAT)</label>
                        <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" dir="ltr" />
                        <small class="form-help">Create token with <strong>repo</strong> scope at GitHub → Settings → Developer settings</small>
                        <span id="pat-error" class="form-error" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="repo-input">Repository</label>
                        <input type="text" id="repo-input" placeholder="username/repository" dir="ltr" />
                        <small class="form-help">Format: <code>owner/repository-name</code></small>
                        <span id="repo-error" class="form-error" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <button id="test-connection-btn" class="btn btn-secondary">🔍 Test Connection</button>
                        <span id="test-result" aria-live="polite"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="settings-save" class="btn btn-primary">💾 Save Settings</button>
                    <button id="settings-cancel" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
        <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/yt-archive-system/sw.js');
        });
      }
    </script>
    <script src="/yt-archive-system/assets/main.js"></script>
</body>
</html>
